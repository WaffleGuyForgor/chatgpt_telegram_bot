telegram_token: ""

# Groq (default LLM provider — fast, free tier)
groq_api_key: ""
# groq_api_base: "https://api.groq.com/openai/v1"  # default, no need to set

# Multiple API keys for load spreading (comma-separated, optional)
# If set, rotates keys round-robin to avoid rate limits
# llm_api_keys: "gsk_key1,gsk_key2,gsk_key3"

# Default model
default_model: "openai/gpt-oss-20b"

# Bot Owner Telegram user ID (enables /panel, /sethome, /broadcast)
owner_id: 6274319204

# Allowed users/groups (leave empty to allow everyone)
allowed_telegram_usernames: []

new_dialog_timeout: 600
enable_message_streaming: true
max_dialog_messages: 30
n_chat_modes_per_page: 5
