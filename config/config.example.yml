telegram_token: ""

# Groq (default LLM provider — fast, free tier)
groq_api_key: ""
# groq_api_base: "https://api.groq.com/openai/v1"  # default, no need to set

# Multiple API keys for load spreading (comma-separated, optional)
# If set, rotates keys round-robin to avoid rate limits
# llm_api_keys: "gsk_key1,gsk_key2,gsk_key3"

# OpenRouter provider (optional — enables the nex-agi / nvidia models in models.yml)
# openrouter_api_key: ""
# Multiple OpenRouter keys for rotation (comma-separated, optional):
# openrouter_api_keys: "sk-or-key1,sk-or-key2"
# openrouter_base_url: "https://openrouter.ai/api/v1"  # default, no need to set

# Dahl provider (optional — enables deepseek-ai/DeepSeek-V4-Flash-0731)
# dahl_api_key: ""
# dahl_api_keys: "dahl_key1,dahl_key2"  # multiple keys for rotation (optional)
# dahl_base_url: "https://inference.dahl.global/v1"  # default, no need to set

# Default model
default_model: "openai/gpt-oss-20b"

# Optional: task-based model routing (disabled by default; explicit /model choice always wins)
# routing_enabled: false
# routing_fast_model: "nex-agi/nex-n2.5-mini:free"   # serves tiny/short requests
# routing_deep_model: "openai/gpt-oss-120b"          # serves detailed/deep requests

# Optional: fallback chain tried in order when the primary model's provider fails
# fallback_models: "nex-agi/nex-n2.5-pro:free,openai/gpt-oss-20b"

# Bot Owner Telegram user ID (enables /panel, /sethome, /broadcast)
owner_id: 6274319204

# Allowed users/groups (leave empty to allow everyone)
allowed_telegram_usernames: []

new_dialog_timeout: 600
enable_message_streaming: true
max_dialog_messages: 30
n_chat_modes_per_page: 5
