available_text_models:
  - "openai/gpt-oss-20b"
  - "openai/gpt-oss-120b"
  - "nex-agi/nex-n2.5-pro:free"
  - "nvidia/nemotron-3-ultra-550b-a55b:free"
  - "nex-agi/nex-n2.5-mini:free"
  - "deepseek-ai/DeepSeek-V4-Flash-0731"

# Each chat model declares which provider pool serves it:
#   provider: groq | openrouter | dahl
# Providers are configured via env vars / config.yml:
#   groq       -> LLM_API_KEY(S) / GROQ_API_KEY        + llm_base_url
#   openrouter -> OPENROUTER_API_KEY(S)                + openrouter_base_url
#   dahl       -> DAHL_API_KEY(S)                      + dahl_base_url
info:
  openai/gpt-oss-20b:
    provider: groq
    type: chat_completion
    vision: false
    name: GPT-OSS 20B
    description: OpenAI's open-weight 20B model on Groq — ultra-fast (1000 t/s) with a 131K context window. Great for chat, coding, and everyday tasks.

    price_per_1000_input_tokens: 0.000075
    price_per_1000_output_tokens: 0.0003

    scores:
      Smart: 4
      Fast: 5
      Cheap: 5

